$kind: http-request
url: "{{baseUrl}}/productos/{{idProducto}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "precio": 65000,
      "stock": 5
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 11000
