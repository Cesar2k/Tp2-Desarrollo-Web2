<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fuentes de letras y css-->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="registro">

  <div class="form-container">
        <!-- -->
    <a href="../index.html">
      <img src="../img/registro.jpg" width="100" height="100">
    </a>

    <h1>Registro</h1>
        <!--Formulario de registro: crea el usuario en el backend (POST /usuarios) con la funcion registrarse() de navbar.js-->
    <form onsubmit="event.preventDefault(); registrarse();">
      <label>Nombre</label>
      <input type="text" id="nombre" required><br><br>

      <label>Apellido</label>
      <input type="text" id="apellido" required><br><br>

      <label>Email</label>
      <input type="email" id="email" required><br><br>

      <label>Contraseña</label>
      <input type="password" id="password" required><br><br>

      <button type="submit">Registrarse</button>
    </form>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/productos.js"></script>

</body>
</html>
